<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Levantine Arabic Apps</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #1f1c18;
      --muted: #6e655c;
      --accent: #b84a27;
      --accent-soft: #f6e7e1;
      --border: #e8e0d5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .arabic-badge {
      display: inline-block;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    nav.app-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a.app-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(31, 28, 24, 0.04);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    a.app-link:hover,
    a.app-link:active {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(184, 74, 39, 0.12);
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .link-title {
      font-size: 17px;
      font-weight: 600;
      display: block;
    }

    .link-file {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 2px;
      display: block;
    }

    .chevron {
      color: var(--muted);
      font-size: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <span class="arabic-badge" lang="ar" dir="rtl">عربي لبناني</span>
      <h1>Levantine Arabic</h1>
      <p class="subtitle">Select an app to open</p>
    </header>

    <nav class="app-list" aria-label="Application Directory">
      <!-- 1. Levantine Verb List -->
      <a class="app-link" href="Levantine_100_common_verbs.html">
        <div class="link-content">
          <div class="icon-box" aria-hidden="true">📖</div>
          <div>
            <span class="link-title">100 common Levantine Verbs</span>
            <span class="link-file">from: Lingualism- Levantine Arabic Verbs</span>
          </div>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <!-- 2. Levantine Verb Practice -->
      <a class="app-link" href="Levantine_Verb_Practice.html">
        <div class="link-content">
          <div class="icon-box" aria-hidden="true">✍️</div>
          <div>
            <span class="link-title">Levantine Verb Practice</span>
            <span class="link-file">from: Lingualism- Levantine Arabic Verbs</span>
          </div>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <!-- 3. Stories -->
      <a class="app-link" href="haki_stories_standalone_lebanese_arabic_app.html">
        <div class="link-content">
          <div class="icon-box" aria-hidden="true">🎧</div>
          <div>
            <span class="link-title">Stories</span>
            <span class="link-file">from: Learn Arabic with Sara</span>
          </div>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
