<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levantine Verb Practice</title>
<style>
    :root {
        --primary: #007bff;
        --bg: #f4f7f6;
        --card-bg: #ffffff;
        --text: #333;
        --pronunciation: #777;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
    
    /* Header & Navigation */
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #ddd; margin-bottom: 15px;}
    h1 { font-size: 1.2rem; margin: 0; }
    .toggle-container { display: flex; align-items: center; font-size: 0.9rem; }
    .toggle-container input { margin-right: 5px; }
    
    nav { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    nav button { flex: 1; padding: 10px; border: none; background: #ddd; border-radius: 5px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    nav button.active { background: var(--primary); color: white; }

    /* Main Container */
    .section { display: none; }
    .section.active { display: block; }

    /* Flashcard Styles */
    .flashcard { background: var(--card-bg); border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); min-height: 250px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: 0.3s; }
    .flashcard:active { transform: scale(0.98); }
    .arabic-text { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }

    /* Verb ID Placement */
    .card-id { position: absolute; top: 12px; left: 15px; font-size: 0.95rem; font-weight: bold; color: #aaa; }
  
    /* Pronunciation Class - Controlled by JS */
    .pron { font-size: 1.0rem; color: var(--pronunciation); display: none; font-style: italic; margin-top: -5px; margin-bottom: 10px;}
    body.show-pronunciation .pron { display: block; }
    body.show-pronunciation span.pron { display: inline-block; margin-left: 5px;}

    /* Conjugation Grid */
    .conj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 15px; }
    .conj-col { background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
    .conj-item { margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    .conj-item:last-child { border-bottom: none; }
    .person-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

     /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; justify-content: center; }
    .controls select, .controls button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 0.9rem; }
    .btn-action { background: var(--primary); color: white; border: none; width: 100%; margin-top: 15px; font-weight: bold; }

    /* Practice Section */
    .question-box { background: var(--card-bg); padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .question-text { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
    .answer-box { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin: 15px 0; display: none; }
    .answer-box.visible { display: block; }
    
</style>
</head>
<body>

<header>
    <h1>Levantine Verbs</h1>
    <div class="toggle-container">
        <input type="checkbox" id="pronToggle" onchange="togglePronunciation()">
        <label for="pronToggle">Pronunciation</label>
    </div>
</header>

<nav>
    <button id="nav-review" class="active" onclick="switchTab('review')">1. Review</button>
    <button id="nav-conjugation" onclick="switchTab('conjugation')">2. Conjugate</button>
    <button id="nav-suffixes" onclick="switchTab('suffixes')">3. Suffixes</button>
</nav>

<!-- SECTION 1: REVIEW -->
<div id="review" class="section active">
    <div class="controls">
        <select id="tenseSelect" onchange="updateReviewCard()">
            <option value="perfect">Perfect (Past)</option>
            <option value="imperfect">Imperfect (Present/Subj)</option>
            <option value="bi_imperfect">Bi-Imperfect (Continuous)</option>
            <option value="imperative">Imperative</option>
            <option value="participle">Active Participle</option>
        </select>
    </div>

    <div class="flashcard" onclick="flipReviewCard()">
        <div id="review-front">
            <div class="arabic-text" id="rev-ar">كان</div>
            <div class="pron" id="rev-pr">kān</div>
            <div style="font-size: 1.2rem; margin-top: 10px;" id="rev-en">to be</div>
        </div>
        <div id="review-back" style="display: none;">
            <div id="rev-tense-label" style="font-weight:bold; margin-bottom:10px;"></div>
            <div class="conj-grid" id="rev-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <button class="btn-action" onclick="prevVerb()">Previous Verb</button>
        <button class="btn-action" onclick="nextVerb()">Next Verb</button>
    </div>
</div>

<!-- SECTION 2: CONJUGATION -->
<div id="conjugation" class="section">
    <div class="controls">
        <select id="pracTenseSelect" onchange="loadNewQuestion()">
            <option value="mixed">All Tenses (Mixed)</option>
            <option value="perfect">Perfect</option>
            <option value="imperfect">Imperfect</option>
            <option value="bi_imperfect">Bi-Imperfect</option>
            <option value="imperative">Imperative</option>
        </select>
    </div>
    
    <div class="question-box">
        <div class="person-label" id="prac-tense-hint"></div>
        <div class="question-text" id="prac-q">I came</div>
        <div class="pron" id="prac-q-pr" style="margin-bottom: 15px;"></div> 
        
        <div class="answer-box" id="prac-a">
            <span id="prac-a-ar" style="display: block;">إجيت</span>
            <div class="pron" id="prac-a-pr">ijit</div>
        </div>
        <button class="btn-action" id="prac-btn" onclick="handlePracticeClick()">Show Answer</button>
    </div>
</div>

<!-- SECTION 3: SUFFIXES -->
<div id="suffixes" class="section">
    <div class="question-box">
        <div class="person-label">Guess the translation</div>
        <div class="question-text" id="suff-q">He saw me</div>

        <button class="btn-action" id="suff-btn" onclick="handleSuffixClick()">Show Answer</button>
    </div>
</div>

    // --- LOGIC ---
    function togglePronunciation() {
        if(document.getElementById('pronToggle').checked) {
            document.body.classList.add('show-pronunciation');
        } else {
            document.body.classList.remove('show-pronunciation');
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');
        
        if(tabId === 'conjugation') loadNewQuestion();
        if(tabId === 'suffixes') loadNewSuffix();
    }

    let currentVerbIndex = 0;
    let isFlipped = false;

    function updateReviewCard() {
        const v = verbs[currentVerbIndex];
        const tense = document.getElementById('tenseSelect').value;
        
        document.getElementById('rev-ar').innerText = v.arabic;
        document.getElementById('rev-pr').innerText = v.pronunciation;
        document.getElementById('rev-en').innerText = v.english;
        
        document.getElementById('rev-tense-label').innerText = tense.replace('_', '-').toUpperCase();
        let gridHTML = `<div class="conj-col"><strong>Singular</strong>`;
        let pluralHTML = `<div class="conj-col"><strong>Plural</strong>`;
        
        const conjData = v.conjugations[tense];
        
        for (const [person, data] of Object.entries(conjData)) {
            const itemStr = `<div class="conj-item"><span class="person-label">${person}</span><br>${data.ar} <span class="pron">${data.pr}</span></div>`;
            if (person.includes("We") || person.includes("pl") || person.includes("They") || person === "Plural") {
                pluralHTML += itemStr;
            } else {
                gridHTML += itemStr;
            }
        }
        
        gridHTML += `</div>` + pluralHTML + `</div>`;
        document.getElementById('rev-grid').innerHTML = gridHTML;
    }

    function flipReviewCard() {
        isFlipped = !isFlipped;
        document.getElementById('review-front').style.display = isFlipped ? 'none' : 'block';
        document.getElementById('review-back').style.display = isFlipped ? 'block' : 'none';
    }

    function nextVerb() {
        currentVerbIndex = (currentVerbIndex + 1) % verbs.length;
        if(isFlipped) flipReviewCard();
        updateReviewCard();
    }

    function prevVerb() {
        currentVerbIndex = (currentVerbIndex - 1 + verbs.length) % verbs.length;
        if(isFlipped) flipReviewCard();
        updateReviewCard();
    }

    let practiceQuestions = [];
    let currentPracQ = {};

    function generatePracticeQuestions() {
        practiceQuestions = [];
        verbs.forEach(v => {
            for (const [tense, persons] of Object.entries(v.conjugations)) {
                for (const [person, data] of Object.entries(persons)) {
                    practiceQuestions.push({
                        q_en: `${person} ${v.english}`,
                        a_ar: data.ar,
                        a_pr: data.pr,
                        tense: tense
                    });
                }
            }
        });
    }

    function loadNewQuestion() {
        if(practiceQuestions.length === 0) generatePracticeQuestions();
        
        const selectedTense = document.getElementById('pracTenseSelect').value;
        let filtered = practiceQuestions;
        if(selectedTense !== 'mixed') {
            filtered = practiceQuestions.filter(q => q.tense === selectedTense);
        }
        
        const randIndex = Math.floor(Math.random() * filtered.length);
        currentPracQ = filtered[randIndex];
        
        const guessArabic = Math.random() > 0.5;

        document.getElementById('prac-tense-hint').innerText = `Tense: ${currentPracQ.tense.replace('_',' ')}`;
        document.getElementById('prac-a').classList.remove('visible');
        document.getElementById('prac-btn').innerText = "Show Answer";

        if(guessArabic) {
            document.getElementById('prac-q').innerText = currentPracQ.q_en;
            document.getElementById('prac-q-pr').innerText = "";
            document.getElementById('prac-a-ar').innerText = currentPracQ.a_ar;
            document.getElementById('prac-a-pr').innerText = currentPracQ.a_pr;
        } else {
            document.getElementById('prac-q').innerText = currentPracQ.a_ar;
            document.getElementById('prac-q-pr').innerText = currentPracQ.a_pr;
            document.getElementById('prac-a-ar').innerText = currentPracQ.q_en;
            document.getElementById('prac-a-pr').innerText = "";
        }
    }

    function handlePracticeClick() {
        const answerBox = document.getElementById('prac-a');
        if(answerBox.classList.contains('visible')) {
            loadNewQuestion();
        } else {
            answerBox.classList.add('visible');
            document.getElementById('prac-btn').innerText = "Next Question";
        }
    }

    let currentSuffQ = {};

    function loadNewSuffix() {
        const randIndex = Math.floor(Math.random() * suffixPractice.length);
        currentSuffQ = suffixPractice[randIndex];
        
        const guessArabic = Math.random() > 0.5;
        document.getElementById('suff-a').classList.remove('visible');

        if(guessArabic) {

            document.getElementById('suff-a-pr').innerText = currentSuffQ.pr;
        } else {
            document.getElementById('suff-q').innerText = currentSuffQ.ar;
            document.getElementById('suff-q-pr').innerText = currentSuffQ.pr;
            document.getElementById('suff-a-ar').innerText = currentSuffQ.en;
            document.getElementById('suff-a-pr').innerText = "";
        }
    }

    function handleSuffixClick() {
        const answerBox = document.getElementById('suff-a');
        if(answerBox.classList.contains('visible')) {
            loadNewSuffix();
        } else {
            answerBox.classList.add('visible');
            document.getElementById('suff-btn').innerText = "Next Question";
        }
    }

    // Init
    updateReviewCard();
    generatePracticeQuestions();
