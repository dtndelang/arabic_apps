    // ADD NEW STORY MODAL (MANUAL ARABIC INPUT FOR PROGRESSIVE LESSONS)
    // ============================================================================
    function AddStoryModal({ onClose, onSave }) {
      const [titleAr, setTitleAr] = useState('');
      const [titleEn, setTitleEn] = useState('');
      const [level, setLevel] = useState('Intermediate (B1)');
      const [rawArabicStory, setRawArabicStory] = useState('');
      const [rawTranslit, setRawTranslit] = useState('');
      const [rawEnglish, setRawEnglish] = useState('');
      const [vocabLines, setVocabLines] = useState('');
      const [audioLinks, setAudioLinks] = useState({
        Lebanese: '',
        Jordanian: '',
        Egyptian: '',
        Emirati: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!rawArabicStory.trim()) return;

        const arLines = rawArabicStory
          .split('\n')
          .map((l) => l.trim())
          .filter(Boolean);
        const trLines = rawTranslit.split('\n').map((l) => l.trim());
        const enLines = rawEnglish.split('\n').map((l) => l.trim());

        const sentences = arLines.map((ar, i) => ({
          ar,
          translit: trLines[i] || '',
          en: enLines[i] || ''
        }));

        const parsedVocab = vocabLines
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line, i) => {
            const parts = line.split('|').map((p) => p.trim());
            return {
              id: `custom-v-${Date.now()}-${i}`,
              ar: parts[0] || line,
              translit: parts[1] || '',
              en: parts[2] || 'Story vocabulary',
              pos: 'Word',
              example: ''
            };
          });

        const finalVocab =
          parsedVocab.length > 0
            ? parsedVocab
            : arLines[0]
                .split(' ')
                .slice(0, 6)
                .map((w, i) => ({
                  id: `auto-v-${Date.now()}-${i}`,
                  ar: w.replace(/[.,«»]/g, ''),
                  translit: 'From story',
                  en: `Word ${i + 1}`,
                  pos: 'Story Word',
                  example: arLines[0]
                }));

        const generatedWordOrder = sentences.slice(0, 3).map((s, i) => ({
          id: `custom-wo-${Date.now()}-${i}`,
          en: s.en || `Reconstruct sentence ${i + 1} from the story`,
          words: s.ar.replace(/[.,«»]/g, '').split(/\s+/).filter(Boolean)
        }));

        const generatedBlanks = sentences.slice(0, 3).map((s, i) => {
          const tokens = s.ar.split(/\s+/).filter(Boolean);
          const targetIdx = Math.min(1, tokens.length - 1);
          const answer = tokens[targetIdx];
          return {
            id: `custom-fb-${Date.now()}-${i}`,
            sentenceBefore: tokens.slice(0, targetIdx).join(' '),
            sentenceAfter: tokens.slice(targetIdx + 1).join(' '),
            answer,
            options: Array.from(new Set([answer, ...tokens.slice(0, 4)])).slice(0, 4),
            hint: s.translit || 'Complete the sentence from the story'
          };
        });

        onSave({
          titleAr: titleAr.trim() || 'قصة جديدة',
          titleEn: titleEn.trim() || 'Custom Lebanese Story',
          level,
          description: 'Custom story lesson created with manual Arabic input.',
          audioLinks,
          sentences,
          vocabulary: finalVocab,
          verbs: INITIAL_LESSONS[0].verbs.slice(0, 5),
          games: {
            fillBlanks: generatedBlanks,
            wordOrder: generatedWordOrder,
            verbDeclension: INITIAL_LESSONS[0].games.verbDeclension
          }
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl border border-[#E6DFD3] max-w-2xl w-full p-6 shadow-xl my-8 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-4 border-b border-[#EFECE6]">
              <div>
                <h3 className="text-lg font-bold text-[#1E2421]">Create New Story Lesson</h3>
                <p className="text-xs text-[#6B726E]">
                  Enter a new Arabic story (one sentence per line) to generate a complete lesson template.
                </p>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-lg text-[#6B726E] hover:bg-[#FAF7F2] cursor-pointer"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 mt-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-[#4A524E] mb-1">Arabic Title</label>
                  <input
                    type="text"
                    dir="rtl"
                    value={titleAr}
                    onChange={(e) => setTitleAr(e.target.value)}
                    placeholder="مثال: رحلة عَ الجبل"
                    className="w-full px-3 py-2 rounded-xl border border-[#DFD8CC] font-arabic text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#4A524E] mb-1">English Title</label>
                  <input
                    type="text"
                    value={titleEn}
                    onChange={(e) => setTitleEn(e.target.value)}
                    placeholder="e.g. Trip to the Mountains"
                    className="w-full px-3 py-2 rounded-xl border border-[#DFD8CC] text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#4A524E] mb-1">Difficulty Level</label>
                  <select
                    value={level}
                    onChange={(e) => setLevel(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-[#DFD8CC] text-sm bg-white"
                  >
                    <option>Beginner (A1)</option>
                    <option>Elementary (A2)</option>
                    <option>Intermediate (B1)</option>
                    <option>Upper Intermediate (B2)</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-[#1B4332] mb-1">
                  Arabic Story Text (Required — put each sentence on a new line)
                </label>
                <textarea
                  required
                  rows={4}
                  dir="rtl"
                  value={rawArabicStory}
                  onChange={(e) => setRawArabicStory(e.target.value)}
                  placeholder="اكتب القصة باللهجة اللبنانية هون..."
                  className="w-full p-3 rounded-xl border border-[#DFD8CC] font-arabic text-base focus:outline-none focus:border-[#1B4332]"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-[#4A524E] mb-1">
                    Alphabet Pronunciation (Optional, line-by-line)
                  </label>
                  <textarea
                    rows={3}
                    value={rawTranslit}
                    onChange={(e) => setRawTranslit(e.target.value)}
                    placeholder="Line 1 pronunciation...&#10;Line 2 pronunciation..."
                    className="w-full p-3 rounded-xl border border-[#DFD8CC] text-xs"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#4A524E] mb-1">
                    English Translation (Optional, line-by-line)
                  </label>
                  <textarea
                    rows={3}
                    value={rawEnglish}
                    onChange={(e) => setRawEnglish(e.target.value)}
                    placeholder="Line 1 translation...&#10;Line 2 translation..."
                    className="w-full p-3 rounded-xl border border-[#DFD8CC] text-xs"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-[#4A524E] mb-1">
                  Vocabulary List (Optional — format: Arabic | transliteration | English)
                </label>
                <textarea
                  rows={2}
                  value={vocabLines}
                  onChange={(e) => setVocabLines(e.target.value)}
                  placeholder="جَبَل | jabal | mountain&#10;طَريق | taree' | road"
                  className="w-full p-2.5 rounded-xl border border-[#DFD8CC] text-xs"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-[#4A524E] mb-1.5">
                  Dialect Audio Links (Optional URLs)
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {DIALECTS.map((d) => (
                    <input
                      key={d.id}
                      type="text"
                      value={audioLinks[d.id]}
                      onChange={(e) =>
                        setAudioLinks((prev) => ({ ...prev, [d.id]: e.target.value }))
                      }
                      placeholder={`${d.label} MP3 URL`}
                      className="px-3 py-1.5 rounded-lg border border-[#DFD8CC] text-xs"
                    />
                  ))}
                </div>
              </div>

              <div className="flex justify-end gap-2.5 pt-3 border-t border-[#EFECE6]">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-[#DFD8CC] text-xs sm:text-sm font-semibold text-[#5C6460] cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-[#1B4332] hover:bg-[#143326] text-white text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  Generate Lesson
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount the application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
